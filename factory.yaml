schema_version: 1
target_branch: main
setup: scripts/worker-go.sh mod download
setup_files: [go.mod, go.sum]
setup_environment_policy: clean
gates:
  - name: format
    command: test -z "$(gofmt -l .)"
    timeout: 2m
    blocking: true
    environment_policy: clean
  - name: vet
    command: scripts/worker-go.sh vet ./...
    timeout: 5m
    blocking: true
    depends_on: [format]
    environment_policy: clean
  - name: test
    command: scripts/worker-go.sh test ./...
    timeout: 10m
    blocking: true
    depends_on: [vet]
    environment_policy: clean
  - name: build
    command: scripts/worker-go.sh build -o /tmp/factory ./cmd/factory
    timeout: 5m
    blocking: true
    depends_on: [test]
    environment_policy: clean
role_harness_defaults:
  implementation: codex
  spec_review: codex
  standards_review: codex
model_options:
  implementation: [gpt-5.6-luna]
  spec_review: [gpt-5.6-luna]
  standards_review: [gpt-5.6-luna]
reasoning_effort_options:
  implementation: [max]
  spec_review: [max]
  standards_review: [max]
timeouts:
  setup: 10m
  agent: 90m
  gate: 10m
  review: 30m
retry_limits:
  check_repair:6 
  review_repair: 5
  test_revision: 5
test_policy:
  mode: advisory
  allow_human_exemption: true
  allow_technical_exemption: true
  # Enable only after the measured pilot records a proceed decision in #26.
  allow_automated_objections: false
allowed_overrides: []
caches:
  - name: go-build
    path: /Users/steffenkrakau/.cache/sw-factory/go-build
    read_only: false
worker_build:
  image: ghcr.io/stevie1704/sw-factory-worker
  digest: sha256:57b860a2c81dc250f5889ec32aa0d3ae8c0aed5ba1c38e16d94620caa14e1929
  definition: worker/Dockerfile
base_synchronization:
  mode: never
evaluation:
  retention: ""
