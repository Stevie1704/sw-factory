schema_version: 1
target_branch: main
setup: scripts/worker-go.sh mod download
setup_files: [go.mod, go.sum]
setup_environment_policy: clean
gates:
  - name: format
    command: test -z "$(gofmt -l .)"
    timeout: 2m
    blocking: true
    environment_policy: clean
  - name: vet
    command: scripts/worker-go.sh vet ./...
    timeout: 5m
    blocking: true
    depends_on: [format]
    environment_policy: clean
  - name: test
    command: scripts/worker-go.sh test ./...
    timeout: 10m
    blocking: true
    depends_on: [vet]
    environment_policy: clean
  - name: build
    command: scripts/worker-go.sh build -o /tmp/factory ./cmd/factory
    timeout: 5m
    blocking: true
    depends_on: [test]
    environment_policy: clean
role_harness_defaults:
  test: codex
  implementation: codex
  spec_review: codex
  standards_review: codex
model_options:
  test: [gpt-5.6-luna]
  implementation: [gpt-5.6-luna]
  spec_review: [gpt-5.6-luna]
  standards_review: [gpt-5.6-luna]
reasoning_effort_options:
  test: [max]
  implementation: [max]
  spec_review: [high]
  standards_review: [high]
timeouts:
  setup: 10m
  agent: 90m
  gate: 10m
  review: 30m
review_units:
  max_unit_bytes: 65536
  max_units: 4
retry_limits:
  check_repair: 3
  review_repair: 4
  test_revision: 2
test_policy:
  mode: required
  allow_human_exemption: true
  allow_technical_exemption: true
  # This repository exercises the bounded objection cycle in its own runs.
  allow_automated_objections: true
allowed_overrides: []
caches:
  - name: go-build
    read_only: false
worker_build:
  image: ghcr.io/stevie1704/sw-factory-worker
  digest: sha256:a6e2e078f170cf449a60660a494ea08e25cd293bee0ce9026b0662c188fb01fb
  definition: worker/Dockerfile
base_synchronization:
  mode: never
evaluation:
  retention: ""
