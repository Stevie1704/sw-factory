name: Release

# A pushed vX.Y.Z tag publishes one release: the four worker base image
# variants (combined, Codex only, Claude Code only, Copilot only) for each
# supported worker platform, verified and scanned before they are pushed, one
# multi-platform index per variant pinned by digest, and the host archives
# that link those digests. docs/installation.md documents the artifacts and
# the support matrix.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

env:
  GOTELEMETRY: "off"
  BASE_IMAGE: ghcr.io/stevie1704/sw-factory-base

jobs:
  worker-base:
    name: Worker base (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      # Factory addresses a local worker image as name@<image ID>, which only
      # the containerd image store resolves. Operator hosts need the same store.
      - name: Use the containerd image store
        run: |
          config=/etc/docker/daemon.json
          current="$(sudo cat "$config" 2>/dev/null || echo '{}')"
          printf '%s' "$current" | jq '.features["containerd-snapshotter"] = true' | sudo tee "$config" >/dev/null
          sudo systemctl restart docker
          test "$(docker info --format '{{range .DriverStatus}}{{index . 1}}{{end}}')" = io.containerd.snapshotter.v1
      - name: Build and verify the base variants and the Factory worker
        env:
          FACTORY_RELEASE: ${{ github.ref_name }}
          WORKER_BASE_IMAGE: ${{ env.BASE_IMAGE }}:${{ github.ref_name }}-${{ matrix.arch }}
          WORKER_TAG: ${{ github.ref_name }}-${{ matrix.arch }}
        # The Factory worker builds on the combined base, so the build also
        # runs the repository gates in it. Every variant gets the headless
        # lifecycle check.
        run: scripts/build-worker.sh
      - name: Scan the worker image and every base variant
        shell: bash
        run: |
          status=0
          for reference in "ghcr.io/stevie1704/sw-factory-worker:${{ github.ref_name }}-${{ matrix.arch }}" \
              "$BASE_IMAGE:${{ github.ref_name }}-${{ matrix.arch }}" \
              "$BASE_IMAGE-codex:${{ github.ref_name }}-${{ matrix.arch }}" \
              "$BASE_IMAGE-claude:${{ github.ref_name }}-${{ matrix.arch }}" \
              "$BASE_IMAGE-copilot:${{ github.ref_name }}-${{ matrix.arch }}"; do
            scripts/scan-worker-image.sh "$reference" || status=1
          done
          exit "$status"
      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Push the scanned base variants and record their digests
        shell: bash
        run: |
          mkdir base-digests
          for variant in all codex claude copilot; do
            image="$BASE_IMAGE"
            [[ "$variant" == all ]] || image="$BASE_IMAGE-$variant"
            reference="$image:${{ github.ref_name }}-${{ matrix.arch }}"
            docker push "$reference"
            digest="$(docker buildx imagetools inspect "$reference" --format '{{json .Manifest}}' | jq -r '.digest')"
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error title=Invalid base digest::the registry returned '$digest' for $reference"
              exit 1
            fi
            printf '%s' "$digest" > "base-digests/$variant-${{ matrix.arch }}"
          done
      - name: Keep the base digests for the release job
        uses: actions/upload-artifact@v4
        with:
          name: base-digests-${{ matrix.arch }}
          path: base-digests
      - name: Publish scan metadata
        if: always()
        run: |
          if [ -f .scan-reports/scans.jsonl ]; then
            { echo '```json'; cat .scan-reports/scans.jsonl; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

  release:
    name: Publish release
    needs: worker-base
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Fetch the base digests
        uses: actions/download-artifact@v4
        with:
          pattern: base-digests-*
          merge-multiple: true
          # Outside the checkout, so the release binaries record a clean tree.
          path: ${{ runner.temp }}/base-digests
      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Create the multi-platform base indexes
        id: base
        shell: bash
        run: |
          variants=""
          for variant in all codex claude copilot; do
            image="$BASE_IMAGE"
            [[ "$variant" == all ]] || image="$BASE_IMAGE-$variant"
            reference="$image:${{ github.ref_name }}"
            docker buildx imagetools create --tag "$reference" \
              "$image@$(cat "$RUNNER_TEMP/base-digests/$variant-amd64")" \
              "$image@$(cat "$RUNNER_TEMP/base-digests/$variant-arm64")"
            digest="$(docker buildx imagetools inspect "$reference" --format '{{json .Manifest}}' | jq -r '.digest')"
            platforms="$(docker buildx imagetools inspect "$image@$digest" --format '{{json .Manifest}}' \
              | jq -r '[.manifests[].platform | select(.os != "unknown") | "\(.os)/\(.architecture)"] | sort | join(" ")')"
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ || "$platforms" != "linux/amd64 linux/arm64" ]]; then
              echo "::error title=Invalid base index::$reference has digest '$digest' and platforms '$platforms'"
              exit 1
            fi
            if [[ "$variant" == all ]]; then
              echo "image=$image@$digest" >> "$GITHUB_OUTPUT"
            else
              variants="${variants:+$variants,}$variant=$image@$digest"
            fi
          done
          echo "variants=$variants" >> "$GITHUB_OUTPUT"
      - name: Package and scan the host binaries
        run: make release VERSION="${{ github.ref_name }}" WORKER_BASE_IMAGE="${{ steps.base.outputs.image }}" WORKER_BASE_IMAGES="${{ steps.base.outputs.variants }}"
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A version with a suffix, such as v1.2.3-rc.1, is a release candidate.
          prerelease=""
          case "${{ github.ref_name }}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "${{ github.ref_name }}" dist/*.tar.gz dist/release.json dist/checksums.txt \
            --verify-tag $prerelease --title "${{ github.ref_name }}" \
            --notes "Worker base image (all harnesses): ${{ steps.base.outputs.image }}. Single-harness worker base images: ${{ steps.base.outputs.variants }}. See docs/installation.md for the installation and the support matrix."
      - name: Publish scan metadata
        if: always()
        run: |
          if [ -f .scan-reports/scans.jsonl ]; then
            { echo '```json'; cat .scan-reports/scans.jsonl; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
